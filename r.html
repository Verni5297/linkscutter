<!DOCTYPE html>
<html lang="ru">

<style>

body{
    background-color:rgb(196, 210, 255);
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
} 


.cont {
    background-color: rgb(89, 89, 212);
    margin-left: 30%;
    margin-right: 30%;
    color: rgb(0, 0, 0);
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    margin-top: 10%;
    border-style:hidden;
    border-radius: 20px;
 
}

.label {
    width: 190px;
    border-style: hidden;
    transition: 100ms;
    border-radius: 5px;
}

.label:hover {

    background-color: rgb(240, 240, 240);

}

.text {
    color: rgb(0, 0, 0);
    font-size: 20px;
    margin-bottom: 10px;
}

.butt {

    margin-top: 10px;
    margin-bottom: 10px;
    width: 100px;
    height: 30px;

    border-radius: 10px;
    border-style: hidden;
    background-color: white;
    transition: 100ms;

}

.butt:hover {

    background-color: rgb(219, 219, 219);
    width: 105px;
    height: 35px;


}

.copybutt {

}

.finallink {

    background-color: rgb(255, 255, 255);
    margin-left: 30%;
    margin-right: 30%;
    color: rgb(0, 0, 0);
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    margin-top: 10%;
    border-style:hidden;
    border-radius: 20px;
    margin-top: 10px;
    font-size: 30px;
}


</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="cont">
        <h1>Добро пожаловать!</h1>

        <div class="text">
            Введите ссылку для сокращения
        </div>

        <input type="text" class="label">

        </input>

        <button class="butt" onclick="short()">
            Сократить
        </button>

        

    </div>

    <div class="finallink">
            <a class="link" href=""></a>

            <button hidden class="copybutt" onclick="copylink()">📑</button>

        </div>

    <ul>

        {{range .Links}} 
        <li>

            {{.OriginalUrl}}-{{.ModUrl}}

        </li>
        {{end}}
    </ul>

    
    
<script>

async function short() {
    let origurl = document.querySelector(".label").value
    let button = document.querySelector(".copybutt")

    let r = await fetch("/short", {
        method : "POST",
        headers : {"Content-Type" : "application/json"},
        body : JSON.stringify({url : origurl})
    })
    let data = await r.json()
    console.log(data)

    let lnk = document.querySelector(".link")
    lnk.href = data.modurl
    lnk.textContent = data.modurl
    button.removeAttribute("hidden")
    
}

async function copylink() {
    let newurl = document.querySelector(".link").href
    await navigator.clipboard.writeText(newurl)
    
}

</script>


</body>
</html>
