<!DOCTYPE html>
<html lang="ru">

<style>

body{
    background-color:rgb(196, 210, 255);
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
} 


.cont {
    background-color: rgb(89, 89, 212);
    margin-left: 30%;
    margin-right: 30%;
    color: rgb(0, 0, 0);
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    margin-top: 10%;
    border-style:hidden;
    border-radius: 20px;
 
}

.label {
    width: 190px;
    border-style: hidden;
    transition: 100ms;
    border-radius: 5px;
}

.label:hover {

    background-color: rgb(240, 240, 240);

}

.text {
    color: rgb(0, 0, 0);
    font-size: 20px;
    margin-bottom: 10px;
}

.butt {

    margin-top: 10px;
    margin-bottom: 10px;
    width: 100px;
    height: 30px;

    border-radius: 10px;
    border-style: hidden;
    background-color: white;
    transition: 100ms;

}

.butt:hover {

    background-color: rgb(219, 219, 219);
    width: 105px;
    height: 35px;


}

.copybutt {

}

.finallink {

    background-color: rgb(255, 255, 255);
    margin-left: 30%;
    margin-right: 30%;
    color: rgb(0, 0, 0);
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    margin-top: 10%;
    border-style:hidden;
    border-radius: 20px;
    margin-top: 10px;
    font-size: 30px;
}

.links-list {
    margin-top: 300px;
    margin-left: 30%;
    margin-right: 30%;
    list-style: none;
    padding: 0;
}

.link-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;              /* отступ между блоками */
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

.link-original,
.link-mod {
    flex: 1 1 50%;          /* каждый блок занимает половину строки */
    min-width: 0;           /* чтобы длинный текст не ломал flex */
    padding: 6px 10px;
    border-radius: 6px;
    word-break: break-all;  /* длинные URL переносятся */
}

.link-original {
    background: #f0f4ff;
    color: #1a3a8f;
}

.link-mod {
    background: #eefaf0;
    color: #1a7f37;
}


</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="cont">
        <h1>Добро пожаловать!</h1>

        <div class="text">
            Введите ссылку для сокращения
        </div>

        <input type="text" class="label">

        </input>

        <button class="butt" onclick="short()">
            Сократить
        </button>

        

    </div>

    <div class="finallink">
            <a class="link" href=""></a>

            <button hidden class="copybutt" onclick="copylink()">📑</button>

        </div>

    <ul class="links-list">
        <h3>Существующие ссылки:</h3>
    {{range .Links}}
    <li class="link-item">
        <span class="link-original">{{.OriginalUrl}}</span>
        <a class="link-mod" href={{.FullUrl}}>{{.ModUrl}}</a>
        <!-- <span class="link-mod">{{.ModUrl}}</span> -->
    </li>
    {{end}}
</ul>

    
    
<script>

async function short() {
    let origurl = document.querySelector(".label").value
    let button = document.querySelector(".copybutt")

    let r = await fetch("/short", {
        method : "POST",
        headers : {"Content-Type" : "application/json"},
        body : JSON.stringify({url : origurl})
    })
    let data = await r.json()
    console.log(data)

    let lnk = document.querySelector(".link")
    lnk.href = data.modurl
    lnk.textContent = data.modurl
    button.removeAttribute("hidden")
    
}

async function copylink() {
    let newurl = document.querySelector(".link").href
    await navigator.clipboard.writeText(newurl)
    
}

</script>


</body>
</html>
